<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-label="Detecting Financial Fraud via Graph Neural Networks">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071129"/>
      <stop offset="1" stop-color="#0b3b4a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
    <linearGradient id="nodeGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#55d4c9"/>
      <stop offset="1" stop-color="#2aa4ff"/>
    </linearGradient>
    <linearGradient id="susp" x1="0" x2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ff3b3b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bg)" />

  <!-- Subtle grid/mesh -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1" stroke-linecap="round">
    <path d="M0 120 L1200 30" />
    <path d="M0 360 L1200 260" />
    <path d="M0 480 L1200 380" />
    <path d="M0 240 L1200 140" />
  </g>

  <!-- Graph edges -->
  <g stroke="#7fb8c9" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round">
    <line x1="280" y1="190" x2="420" y2="140" />
    <line x1="420" y1="140" x2="600" y2="200" />
    <line x1="280" y1="190" x2="360" y2="320" />
    <line x1="360" y1="320" x2="540" y2="300" />
    <line x1="540" y1="300" x2="700" y2="240" />
    <line x1="600" y1="200" x2="720" y2="110" />
    <line x1="720" y1="110" x2="900" y2="160" />
    <line x1="700" y1="240" x2="900" y2="160" />
    <line x1="540" y1="300" x2="720" y2="110" />
  </g>

  <!-- Nodes -->
  <g filter="url(#soft)">
    <!-- normal nodes -->
    <circle cx="280" cy="190" r="14" fill="url(#nodeGrad)" stroke="#0b2b33" stroke-width="1.5"/>
    <circle cx="420" cy="140" r="12" fill="url(#nodeGrad)" stroke="#0b2b33" stroke-width="1.2"/>
    <circle cx="600" cy="200" r="16" fill="url(#nodeGrad)" stroke="#0b2b33" stroke-width="1.6"/>
    <circle cx="360" cy="320" r="12" fill="url(#nodeGrad)" stroke="#0b2b33" stroke-width="1.2"/>
    <circle cx="540" cy="300" r="10" fill="url(#nodeGrad)" stroke="#0b2b33" stroke-width="1"/>
    <circle cx="700" cy="240" r="13" fill="url(#nodeGrad)" stroke="#0b2b33" stroke-width="1.3"/>
    <circle cx="720" cy="110" r="11" fill="url(#nodeGrad)" stroke="#0b2b33" stroke-width="1.1"/>
    <circle cx="900" cy="160" r="14" fill="url(#nodeGrad)" stroke="#0b2b33" stroke-width="1.5"/>
    <!-- suspicious nodes (red) -->
    <circle cx="540" cy="300" r="24" fill="url(#susp)" fill-opacity="0.14"/>
    <circle cx="720" cy="110" r="8" fill="url(#susp)" stroke="#4a0e0e" stroke-width="1"/>
    <circle cx="900" cy="160" r="6" fill="url(#susp)" stroke="#4a0e0e" stroke-width="1"/>

    <!-- highlight ring -->
    <ellipse cx="540" cy="300" rx="34" ry="26" fill="none" stroke="#ff9f9f" stroke-opacity="0.18" stroke-width="6"/>
  </g>

  <!-- Magnifying glass to imply detection -->
  <g transform="translate(760,300) scale(1.1)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#bfe9ff" stroke-width="8" stroke-opacity="0.9" />
    <circle cx="0" cy="0" r="50" fill="rgba(11,62,78,0.15)" stroke="none"/>
    <line x1="44" y1="44" x2="110" y2="110" stroke="#9fd7ff" stroke-width="12" stroke-linecap="round"/>
    <!-- lens glare -->
    <path d="M-28,-18 q18,12 38,8" stroke="#d9fbff" stroke-width="3" stroke-linecap="round" fill="none" stroke-opacity="0.7"/>
  </g>

  <!-- Title and subtitle -->
  <g>
    <text x="70" y="520" font-family="Inter, Arial, sans-serif" font-size="44" fill="#e8f6ff" font-weight="700">Detecting Financial Fraud via GNNs</text>
    <text x="70" y="565" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bfe8f9">A multi-dataset, graph-based learning approach</text>
  </g>

  <!-- small badge / tag -->
  <g transform="translate(980,520)">
    <rect x="0" y="0" rx="8" ry="8" width="180" height="56" fill="#092a33" opacity="0.9" />
    <text x="90" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#7fe6d6">Graph Neural Networks</text>
  </g>

  <!-- subtle footer line -->
  <rect x="60" y="588" width="1080" height="2" fill="#123b45" opacity="0.6" />
</svg>