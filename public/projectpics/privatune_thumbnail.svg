<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-label="PrivaTune - Privacy tuning for decentralized AI">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071029"/>
      <stop offset="1" stop-color="#0b2f3a"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#7ee7c7"/>
      <stop offset="1" stop-color="#4aa6ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#ff8a5b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- Faint grid lines to suggest network -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1" stroke-linecap="round">
    <path d="M0 80 L1200 10"/>
    <path d="M0 240 L1200 120"/>
    <path d="M0 420 L1200 280"/>
    <path d="M0 560 L1200 420"/>
  </g>

  <!-- Decentralized network (left, mid) -->
  <g stroke="#6fbad1" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round">
    <!-- edges -->
    <line x1="160" y1="220" x2="300" y2="140"/>
    <line x1="300" y1="140" x2="460" y2="200"/>
    <line x1="460" y1="200" x2="360" y2="340"/>
    <line x1="360" y1="340" x2="200" y2="300"/>
    <line x1="200" y1="300" x2="160" y2="220"/>
    <line x1="460" y1="200" x2="620" y2="160"/>
    <line x1="620" y1="160" x2="740" y2="260"/>
    <line x1="740" y1="260" x2="620" y2="360"/>
    <line x1="620" y1="360" x2="460" y2="200"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#glow)">
    <circle cx="160" cy="220" r="14" fill="url(#nodeGrad)" stroke="#042428" stroke-width="1.2"/>
    <circle cx="300" cy="140" r="12" fill="url(#nodeGrad)" stroke="#042428" stroke-width="1"/>
    <circle cx="460" cy="200" r="18" fill="url(#nodeGrad)" stroke="#042428" stroke-width="1.4"/>
    <circle cx="360" cy="340" r="12" fill="url(#nodeGrad)" stroke="#042428" stroke-width="1"/>
    <circle cx="200" cy="300" r="10" fill="url(#nodeGrad)" stroke="#042428" stroke-width="1"/>
    <circle cx="620" cy="160" r="13" fill="url(#nodeGrad)" stroke="#042428" stroke-width="1.1"/>
    <circle cx="740" cy="260" r="11" fill="url(#nodeGrad)" stroke="#042428" stroke-width="1"/>
    <circle cx="620" cy="360" r="9" fill="url(#nodeGrad)" stroke="#042428" stroke-width="0.9"/>
  </g>

  <!-- Privacy shield (center-right) -->
  <g transform="translate(840,230)">
    <!-- shield base -->
    <path d="M0 -86 L48 -46 A6 6 0 0 1 48 -18 L0 42 L-48 -18 A6 6 0 0 1 -48 -46 Z"
          fill="url(#bg)" stroke="#5fd8d2" stroke-width="4" opacity="0.95"/>
    <!-- inner shield fill -->
    <path d="M0 -74 L40 -40 A5 5 0 0 1 40 -22 L0 30 L-40 -22 A5 5 0 0 1 -40 -40 Z"
          fill="rgba(8,50,58,0.9)" stroke="none"/>
    <!-- lock -->
    <rect x="-18" y="-6" width="36" height="30" rx="4" ry="4" fill="#e9fdf8" stroke="#022a2c" stroke-width="1.5"/>
    <path d="M-6 -6 v-12 a12 12 0 0 1 24 0 v12" fill="none" stroke="#022a2c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="3.5" fill="#022a2c"/>
    <!-- small glow -->
    <ellipse cx="0" cy="44" rx="90" ry="24" fill="url(#accent)" opacity="0.06"/>
  </g>

  <!-- Tuning slider (bottom-right) -->
  <g transform="translate(720,420)">
    <!-- rail -->
    <rect x="-260" y="-12" width="520" height="24" rx="12" fill="#07343a" opacity="0.9"/>
    <!-- ticks -->
    <g stroke="#0faea0" stroke-opacity="0.6" stroke-width="1.2">
      <line x1="-220" y1="-18" x2="-220" y2="18"/>
      <line x1="-140" y1="-18" x2="-140" y2="18"/>
      <line x1="-60" y1="-18" x2="-60" y2="18"/>
      <line x1="20" y1="-18" x2="20" y2="18"/>
      <line x1="100" y1="-18" x2="100" y2="18"/>
      <line x1="180" y1="-18" x2="180" y2="18"/>
    </g>
    <!-- knob -->
    <g transform="translate(-20,0)" filter="url(#soft2)">
      <circle cx="0" cy="0" r="26" fill="url(#accent)" stroke="#412011" stroke-width="2"/>
      <circle cx="-2" cy="-3" r="6" fill="#fff" fill-opacity="0.18"/>
      <text x="0" y="6" font-family="Inter, Arial, sans-serif" font-size="10" fill="#08181a" text-anchor="middle" font-weight="700">τ</text>
    </g>
    <!-- label -->
    <text x="0" y="48" font-family="Inter, Arial, sans-serif" font-size="14" fill="#bfeee3" text-anchor="middle">Privacy tuning</text>
  </g>

  <!-- Project title and subtitle -->
  <g>
    <text x="70" y="480" font-family="Inter, Arial, sans-serif" font-size="56" fill="#e6fffb" font-weight="700">PrivaTune</text>
    <text x="70" y="520" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bfe6df">Privacy tuning for decentralized AI</text>
  </g>

  <!-- small tag with org -->
  <g transform="translate(980,520)">
    <rect x="0" y="0" rx="8" ry="8" width="180" height="56" fill="#07292c" opacity="0.9" />
    <text x="90" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#7ee7c7">RPI-Decentralized-AI</text>
  </g>

  <!-- subtle footer line -->
  <rect x="60" y="588" width="1080" height="2" fill="#09323a" opacity="0.6" />
</svg>